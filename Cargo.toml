[package]
name = "rsona"
version = "0.0.0"
edition = "2024"
description = "Music information retrieval and audio feature extraction in Rust"
license = "Apache-2.0"
repository = "https://github.com/DanielFidalgo/rsona"
readme = "README.md"
keywords = ["audio", "music", "mir", "dsp"]
categories = ["multimedia::audio"]

[dependencies]
# Audio decoding
symphonia = { version = "0.5.5", features = ["aac", "mp3", "flac", "wav"] }
ndarray = "0.17.2"
rustfft = "6.4.1"
faer = "0.23.2"
rayon = "1.11.0"
num_cpus = "1.16.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
polars = { version = "0.52.0", optional = true }

[dev-dependencies]
hound = "3"

[features]
default = []
dataframe = ["polars"]

[[bin]]
name = "rsona_bench"
path = "bench/rsona_bench.rs"

[[bin]]
name = "loopfinder_bench"
path = "bench/loopfinder_bench.rs"

[[bin]]
name = "loopfinder_bench_improved"
path = "bench/loopfinder_bench_improved.rs"

[[bin]]
name = "loopfinder_bench_chroma"
path = "bench/loopfinder_bench_chroma.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
# For maximum performance with SIMD, build with:
# RUSTFLAGS="-C target-cpu=native" cargo build --release
