name: Benchmark Comparison

on:
  pull_request:
    paths:
      - "src/**"
      - "bench/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      RUSTFLAGS: "-C target-cpu=x86-64"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-benchmark-v2
          restore-keys: |
            ${{ runner.os }}-pip-benchmark-v2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          # Force upgrade librosa to ensure >= 0.10.0
          echo "Upgrading librosa to >= 0.10.0..."
          pip install --upgrade --force-reinstall --no-cache-dir 'librosa>=0.10.0'

          # Install remaining requirements
          pip install -r bench/requirements.txt

      - name: Verify librosa version and API
        run: |
          echo "Verifying librosa installation..."
          python3 -c "import librosa; print(f'librosa version: {librosa.__version__}')"

          echo "Testing librosa.feature.tempo API..."
          python3 -c "import librosa; assert hasattr(librosa.feature, 'tempo'); print('✓ librosa.feature.tempo API is available')"

      - name: Cache test audio
        id: cache-audio
        uses: actions/cache@v4
        with:
          path: test_audio.wav
          key: test-audio-freesound-v1

      - name: Download test audio
        if: steps.cache-audio.outputs.cache-hit != 'true'
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: |
          echo "Downloading test audio for benchmarking..."

          # Debug: Check if FREESOUND_API_KEY is set
          if [ -n "${FREESOUND_API_KEY:-}" ]; then
            echo "✓ FREESOUND_API_KEY is set (length: ${#FREESOUND_API_KEY})"
          else
            echo "⚠️  FREESOUND_API_KEY is not set"
            echo "This will fall back to synthetic audio generation"
          fi
          echo ""

          # Install dependencies (sox for fallback generation)
          sudo apt-get update -qq
          sudo apt-get install -y -qq sox libsox-fmt-all curl

          # Run the download script (will try Freesound, then fallback to generation)
          chmod +x scripts/download_test_audio.sh
          ./scripts/download_test_audio.sh test_audio.wav

          # Verify final file is valid
          if [ ! -f "test_audio.wav" ]; then
            echo "Error: test_audio.wav was not created"
            exit 1
          fi

          # Check it's actually a WAV file
          file_type=$(file -b test_audio.wav)
          if ! echo "$file_type" | grep -qi "wave\|wav\|riff"; then
            echo "Error: test_audio.wav is not a valid WAV file: $file_type"
            exit 1
          fi

          # Check file size is reasonable (should be > 100KB)
          file_size=$(stat -c%s test_audio.wav)
          if [ "$file_size" -lt 100000 ]; then
            echo "Error: test_audio.wav is too small ($file_size bytes)"
            exit 1
          fi

          echo "✓ Test audio validated successfully"
          ls -lh test_audio.wav

      - name: Verify audio file exists
        run: |
          if [ ! -f "test_audio.wav" ]; then
            echo "Error: test_audio.wav not found"
            exit 1
          fi
          echo "Audio file ready:"
          ls -lh test_audio.wav

      - name: Find baseline version
        id: baseline
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "No tags found - will run without baseline comparison"
            echo "has_baseline=false" >> $GITHUB_OUTPUT
          else
            echo "Found baseline: $TAG"
            echo "has_baseline=true" >> $GITHUB_OUTPUT
            echo "baseline=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Run comprehensive benchmark comparison
        run: |
          if [ "${{ steps.baseline.outputs.has_baseline }}" = "true" ]; then
            python3 bench/compare_versions.py test_audio.wav \
              --baseline "${{ steps.baseline.outputs.baseline }}" \
              --iterations 5 \
              --warmup 2 \
              --output bench/BENCHMARK_RESULTS.md
          else
            python3 bench/compare_versions.py test_audio.wav \
              --iterations 5 \
              --warmup 2 \
              --output bench/BENCHMARK_RESULTS.md
          fi

      - name: Run librosa comparison
        if: always()
        continue-on-error: true
        run: |
          echo "Running rsona vs librosa comparison..."
          if python3 bench/compare_bench.py test_audio.wav \
            --iterations 5 \
            --warmup 2 \
            --output markdown \
            --file bench/LIBROSA_COMPARISON.md; then
            echo "✓ Librosa comparison completed successfully"
          else
            echo "⚠ Librosa comparison failed - creating error report"
            cat > bench/LIBROSA_COMPARISON.md << 'EOF'
          # rsona vs librosa Comparison

          ## ⚠️ Comparison Failed

          The librosa comparison could not be completed. This is likely due to:

          1. **rsona output format mismatch** - Check that `rsona_bench --compat` works
          2. **Librosa not installed** - Python dependencies missing
          3. **Build failure** - rsona_bench failed to compile

          ### Debugging Steps

          Run locally to diagnose:
          ```bash
          # Test rsona_bench
          cargo run --release --bin rsona_bench -- test_audio.wav --compat

          # Test comparison script
          python3 bench/compare_bench.py test_audio.wav
          ```

          ### Check Workflow Logs

          Review the "Run librosa comparison" step logs for detailed error messages.

          ---
          *This is an error report. Fix the issues above to see full comparison results.*
          EOF
          fi

      - name: Rebuild rsona_bench for feature parity
        if: always()
        run: |
          echo "Rebuilding rsona_bench with baseline CPU instructions..."
          cargo build --release --bin rsona_bench

          echo ""
          echo "Testing binary with --features flag..."
          if target/release/rsona_bench test_audio.wav --features > /tmp/features_test.json 2>&1; then
            echo "✓ Binary works with --features flag"
            echo "Output size: $(wc -c < /tmp/features_test.json) bytes"
          else
            echo "❌ Binary failed with --features flag"
            echo "Error output:"
            cat /tmp/features_test.json
            exit 1
          fi

      - name: Run feature parity validation
        if: always()
        continue-on-error: true
        run: |
          echo "Running feature parity validation..."
          echo "Audio file: $(ls -lh test_audio.wav)"
          echo "Binary: $(ls -lh target/release/rsona_bench)"
          echo ""

          if python3 bench/feature_parity.py test_audio.wav \
            --tolerance 0.01 \
            --output bench/FEATURE_PARITY.md 2>&1 | tee feature_parity.log; then
            echo "✓ Feature parity validation completed"
          else
            echo "⚠ Feature parity validation failed"
            echo ""
            echo "=== Error Log ==="
            cat feature_parity.log
            echo "=== End Error Log ==="
            echo ""
            echo "⚠ Feature parity validation failed - creating error report"
            cat > bench/FEATURE_PARITY.md << 'EOF'
          # rsona Feature Parity Report

          ## ⚠️ Validation Failed

          The feature parity validation could not be completed. This is likely due to:

          1. **rsona_bench build failure** - Check that `rsona_bench --features` compiles
          2. **Feature extraction error** - JSON parsing or array conversion issues
          3. **librosa incompatibility** - librosa API changes or missing dependencies
          4. **Numerical comparison failure** - Arrays with incompatible shapes

          ### Debugging Steps

          Run locally to diagnose:
          ```bash
          # Test rsona_bench with features flag
          cargo run --release --bin rsona_bench -- test_audio.wav --features

          # Test full validation
          python3 bench/feature_parity.py test_audio.wav --tolerance 0.01
          ```

          ### Check Workflow Logs

          Review the "Run feature parity validation" step logs for detailed error messages.

          ---
          *This is an error report. Fix the issues above to see full validation results.*
          EOF
          fi

      - name: Display benchmark summary
        if: always()
        run: |
          if [ -f "bench/BENCHMARK_RESULTS.md" ]; then
            echo "================================"
            echo "BENCHMARK RESULTS SUMMARY"
            echo "================================"
            head -50 bench/BENCHMARK_RESULTS.md
            echo ""
            echo "Full report available in artifacts"
          fi

          if [ -f "bench/LIBROSA_COMPARISON.md" ]; then
            echo ""
            echo "================================"
            echo "LIBROSA COMPARISON SUMMARY"
            echo "================================"
            head -30 bench/LIBROSA_COMPARISON.md
            echo ""
            echo "Full comparison available in artifacts"
          fi

          if [ -f "bench/FEATURE_PARITY.md" ]; then
            echo ""
            echo "================================"
            echo "FEATURE PARITY SUMMARY"
            echo "================================"
            head -30 bench/FEATURE_PARITY.md
            echo ""
            echo "Full parity report available in artifacts"
          fi

      - name: Check for performance regressions
        run: |
          if [ -f "bench/BENCHMARK_RESULTS.md" ]; then
            if grep -q "⚠️ REGRESSION" bench/BENCHMARK_RESULTS.md; then
              echo "::warning::Performance regression detected! Review the benchmark report."
              # Don't fail the build, just warn
              # exit 1
            fi
          fi

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-reports
          path: |
            bench/BENCHMARK_RESULTS.md
            bench/LIBROSA_COMPARISON.md
            bench/FEATURE_PARITY.md
          retention-days: 90

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-binaries
          path: |
            target/release/rsona_bench_*
          retention-days: 7

      - name: Delete previous benchmark comments
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const comment of comments.data) {
              if (comment.user.login === 'github-actions[bot]' &&
                  comment.body.includes('📊 Benchmark Results')) {
                console.log(`Deleting previous benchmark comment: ${comment.id}`);
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'bench/BENCHMARK_RESULTS.md';

            if (!fs.existsSync(reportPath)) {
              console.log('No benchmark report found');
              return;
            }

            const report = fs.readFileSync(reportPath, 'utf8');

            // Extract summary section
            const summaryMatch = report.match(/## Summary\n\n[\s\S]*?(?=\n## |$)/);
            const summary = summaryMatch ? summaryMatch[0] : report.substring(0, 1000);

            const repoUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo;
            const runUrl = repoUrl + '/actions/runs/' + context.runId;

            const body = '## 📊 Benchmark Results\n\n' +
              summary + '\n\n' +
              '<details>\n' +
              '<summary>View Full Report</summary>\n\n' +
              report + '\n\n' +
              '</details>\n\n' +
              '📎 Full report available in [workflow artifacts](' + runUrl + ')';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Summary
        if: always()
        run: |
          echo "## Benchmark Complete 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "bench/BENCHMARK_RESULTS.md" ]; then
            echo "### Version Comparison" >> $GITHUB_STEP_SUMMARY
            cat bench/BENCHMARK_RESULTS.md >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Version comparison report not generated" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f "bench/LIBROSA_COMPARISON.md" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Librosa Comparison" >> $GITHUB_STEP_SUMMARY
            cat bench/LIBROSA_COMPARISON.md >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f "bench/FEATURE_PARITY.md" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Feature Parity Validation" >> $GITHUB_STEP_SUMMARY
            cat bench/FEATURE_PARITY.md >> $GITHUB_STEP_SUMMARY
          fi
