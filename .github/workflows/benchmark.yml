name: Benchmark Comparison

on:
  pull_request:
    paths:
      - 'src/**'
      - 'bench/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-benchmark
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy librosa

      - name: Cache test audio
        id: cache-audio
        uses: actions/cache@v4
        with:
          path: test_audio.wav
          key: test-audio-generated-v1

      - name: Generate test audio
        if: steps.cache-audio.outputs.cache-hit != 'true'
        run: |
          echo "Generating test audio for benchmarking..."

          # Install sox
          sudo apt-get update -qq
          sudo apt-get install -y -qq sox libsox-fmt-all

          # Generate 15-second test audio with simulated beats (~120 BPM)
          # Two-tone harmony with tremolo creates realistic musical patterns
          sox -n -r 44100 -c 2 test_audio.wav \
            synth 15 sine 220 sine 330 \
            fade 0.1 15 0.1 tremolo 2 50 gain -3

          echo "✓ Generated test audio (15s, 44.1kHz, Stereo)"

          # Verify final file is valid
          if [ ! -f "test_audio.wav" ]; then
            echo "Error: test_audio.wav was not created"
            exit 1
          fi

          # Check it's actually a WAV file
          file_type=$(file -b test_audio.wav)
          if ! echo "$file_type" | grep -qi "wave\|wav\|riff"; then
            echo "Error: test_audio.wav is not a valid WAV file: $file_type"
            exit 1
          fi

          # Check file size is reasonable (should be > 100KB)
          file_size=$(stat -c%s test_audio.wav)
          if [ "$file_size" -lt 100000 ]; then
            echo "Error: test_audio.wav is too small ($file_size bytes)"
            exit 1
          fi

          echo "✓ Test audio validated successfully"
          ls -lh test_audio.wav

      - name: Verify audio file exists
        run: |
          if [ ! -f "test_audio.wav" ]; then
            echo "Error: test_audio.wav not found"
            exit 1
          fi
          echo "Audio file ready:"
          ls -lh test_audio.wav

      - name: Find baseline version
        id: baseline
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "No tags found, using HEAD~1"
            TAG="HEAD~1"
          fi
          echo "baseline=$TAG" >> $GITHUB_OUTPUT
          echo "Found baseline: $TAG"

      - name: Run comprehensive benchmark comparison
        run: |
          cd bench
          python3 compare_versions.py ../test_audio.wav \
            --baseline "${{ steps.baseline.outputs.baseline }}" \
            --iterations 5 \
            --warmup 2 \
            --output BENCHMARK_RESULTS.md

      - name: Display benchmark summary
        if: always()
        run: |
          if [ -f "bench/BENCHMARK_RESULTS.md" ]; then
            echo "================================"
            echo "BENCHMARK RESULTS SUMMARY"
            echo "================================"
            head -50 bench/BENCHMARK_RESULTS.md
            echo ""
            echo "Full report available in artifacts"
          fi

      - name: Check for performance regressions
        run: |
          if [ -f "bench/BENCHMARK_RESULTS.md" ]; then
            if grep -q "⚠️ REGRESSION" bench/BENCHMARK_RESULTS.md; then
              echo "::warning::Performance regression detected! Review the benchmark report."
              # Don't fail the build, just warn
              # exit 1
            fi
          fi

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: bench/BENCHMARK_RESULTS.md
          retention-days: 90

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-binaries
          path: |
            target/release/rsona_bench_*
          retention-days: 7

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'bench/BENCHMARK_RESULTS.md';

            if (!fs.existsSync(reportPath)) {
              console.log('No benchmark report found');
              return;
            }

            const report = fs.readFileSync(reportPath, 'utf8');

            // Extract summary section
            const summaryMatch = report.match(/## Summary\n\n[\s\S]*?(?=\n## |$)/);
            const summary = summaryMatch ? summaryMatch[0] : report.substring(0, 1000);

            const body = `## 📊 Benchmark Results

${summary}

<details>
<summary>View Full Report</summary>

${report}

</details>

📎 Full report available in [workflow artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Summary
        if: always()
        run: |
          echo "## Benchmark Complete 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "bench/BENCHMARK_RESULTS.md" ]; then
            cat bench/BENCHMARK_RESULTS.md >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Benchmark report not generated" >> $GITHUB_STEP_SUMMARY
          fi
