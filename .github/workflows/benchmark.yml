name: Benchmark Regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install librosa numpy

      - name: Cache test audio file
        id: cache-audio
        uses: actions/cache@v4
        with:
          path: test_audio.wav
          key: test-audio-generated-v1

      - name: Generate test audio
        if: steps.cache-audio.outputs.cache-hit != 'true'
        run: |
          echo "Generating test audio for benchmarking..."

          # Install sox
          sudo apt-get update -qq
          sudo apt-get install -y -qq sox libsox-fmt-all

          # Generate 15-second test audio with simulated beats (~120 BPM)
          # Two-tone harmony with tremolo creates realistic musical patterns
          sox -n -r 44100 -c 2 test_audio.wav \
            synth 15 sine 220 tremolo 2 0.5 \
            synth 15 sine 330 tremolo 2 0.5 mix \
            fade 0.1 15 0.1 \
            gain -3

          echo "✓ Generated test audio (15s, 44.1kHz, Stereo)"

          # Verify final file is valid
          if [ ! -f "test_audio.wav" ]; then
            echo "Error: test_audio.wav was not created"
            exit 1
          fi

          # Check it's actually a WAV file
          file_type=$(file -b test_audio.wav)
          if ! echo "$file_type" | grep -qi "wave\|wav\|riff"; then
            echo "Error: test_audio.wav is not a valid WAV file: $file_type"
            exit 1
          fi

          # Check file size is reasonable (should be > 1MB)
          file_size=$(stat -c%s test_audio.wav 2>/dev/null || stat -f%z test_audio.wav 2>/dev/null || echo "0")
          if [ "$file_size" -lt 100000 ]; then
            echo "Error: test_audio.wav is too small ($file_size bytes)"
            exit 1
          fi

          echo "✓ Test audio validated successfully"
          ls -lh test_audio.wav

      - name: Verify audio file exists
        run: |
          if [ ! -f "test_audio.wav" ]; then
            echo "Error: test_audio.wav not found"
            exit 1
          fi
          echo "Audio file ready:"
          ls -lh test_audio.wav

      - name: Find latest tag
        id: tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [ -n "$TAG" ]; then
            echo "Found tag: $TAG"
          else
            echo "No tags found, skipping baseline comparison"
          fi

      - name: Build bench (current)
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo build --release --bin rsona_bench
          cp target/release/rsona_bench rsona_bench_current

      - name: Run bench (current)
        run: |
          ./rsona_bench_current test_audio.wav > curr.json
          echo "Current benchmark results:"
          cat curr.json

      - name: Checkout previous release
        if: steps.tag.outputs.tag != ''
        run: |
          git stash
          git checkout ${{ steps.tag.outputs.tag }}

      - name: Build bench (base)
        if: steps.tag.outputs.tag != ''
        run: |
          cargo clean
          RUSTFLAGS="-C target-cpu=native" cargo build --release --bin rsona_bench
          cp target/release/rsona_bench rsona_bench_base

      - name: Run bench (base)
        if: steps.tag.outputs.tag != ''
        run: |
          ./rsona_bench_base test_audio.wav > base.json
          echo "Baseline benchmark results:"
          cat base.json

      - name: Compare results
        if: steps.tag.outputs.tag != ''
        run: |
          if [ -f "bench/compare.py" ]; then
            python bench/compare.py base.json curr.json
          else
            echo "Warning: bench/compare.py not found, showing raw comparison"
            echo "=== Base Results ==="
            cat base.json
            echo ""
            echo "=== Current Results ==="
            cat curr.json
          fi

      - name: Upload current results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: curr.json

      - name: Upload comparison results
        if: steps.tag.outputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: |
            curr.json
            base.json
